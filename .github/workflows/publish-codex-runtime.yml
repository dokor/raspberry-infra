name: Publish shared Codex runtime

on:
  pull_request:
    paths:
      - "infra/codex-runtime/**"
      - ".github/workflows/publish-codex-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "infra/codex-runtime/**"
      - ".github/workflows/publish-codex-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dokor/codex-runtime
  CODEX_VERSION: "0.156.1"
  RUNTIME_REVISION: "r1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared runtime
        uses: docker/build-push-action@v6
        with:
          context: infra/codex-runtime
          file: infra/codex-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CODEX_VERSION=${{ env.CODEX_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.CODEX_VERSION }}-${{ env.RUNTIME_REVISION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dokor/raspberry-infra
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.CODEX_VERSION }}
          cache-from: type=gha,scope=codex-runtime
          cache-to: type=gha,scope=codex-runtime,mode=max
