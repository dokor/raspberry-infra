name: Deploy central n8n

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on:
      - self-hosted
      - raspberry
    env:
      N8N_ENV_FILE: ${{ vars.N8N_ENV_FILE || '/srv/infra/raspberry-infra/env/n8n.env' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure automation network
        run: |
          set -Eeuo pipefail
          docker network inspect automation >/dev/null 2>&1 || docker network create automation

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate persistent n8n configuration
        working-directory: infra/n8n
        run: |
          set -Eeuo pipefail
          test -f "$N8N_ENV_FILE" || {
            echo "Missing persistent n8n env file: $N8N_ENV_FILE" >&2
            echo "Create it from infra/n8n/.env.example outside the GitHub Actions checkout." >&2
            exit 1
          }

          docker compose --env-file "$N8N_ENV_FILE" config >/dev/null

      - name: Deploy n8n and Codex bridge
        working-directory: infra/n8n
        run: |
          set -Eeuo pipefail
          docker compose --env-file "$N8N_ENV_FILE" pull n8n
          docker compose --env-file "$N8N_ENV_FILE" build --pull codex-bridge
          docker compose --env-file "$N8N_ENV_FILE" up -d --remove-orphans
