services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - invoice-builder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  invoice-builder:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: invoice-builder
    restart: unless-stopped
    environment:
      SERVICE: all
      NODE_ENV: docker
      DB_DIRECTORY: /data
      PORT: 3000
      DEV_SERVER_URL: 0.0.0.0
      MIGRATIONS_PATH: /app/dist-be/backend/server/shared/migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    ports:
      - "8086:3001"
    networks:
      - invoice-builder

volumes:
  postgres-data:

networks:
  invoice-builder:
    name: invoice-builder