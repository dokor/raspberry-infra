services:
  browser-automations:
    image: ${BROWSER_AUTOMATIONS_IMAGE:-ghcr.io/dokor/browser-automations:latest}
    container_name: browser-automations
    environment:
      PORT: 3000
      AUTOMATION_API_TOKEN: ${AUTOMATION_API_TOKEN:?AUTOMATION_API_TOKEN is required}
      HEADLESS: ${HEADLESS:-true}
      DRY_RUN: ${DRY_RUN:-true}
    volumes:
      - browser-automation-data:/app/data
    expose:
      - "3000"
    networks:
      - automation
    ipc: host
    restart: unless-stopped

networks:
  automation:
    external: true

volumes:
  browser-automation-data:
