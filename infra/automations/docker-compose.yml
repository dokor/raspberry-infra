services:
  browser-automations:
    image: ghcr.io/dokor/browser-automations:latest
    container_name: browser-automations
    environment:
      PORT: 3000
      AUTOMATION_API_TOKEN: ${AUTOMATION_API_TOKEN:?AUTOMATION_API_TOKEN is required}
      HELLCASE_BASE_URL: ${HELLCASE_BASE_URL:-https://hellcase.com/fr}
      HELLCASE_GIVEAWAYS_URL: ${HELLCASE_GIVEAWAYS_URL:-https://hellcase.com/fr/giveaways}
      HELLCASE_NEWBIE_CASE_URL: ${HELLCASE_NEWBIE_CASE_URL:-https://hellcase.com/fr/open/newbie}
      HELLCASE_SESSION_PATH: /app/data/hellcase-session.json
      HEADLESS: ${HEADLESS:-true}
      DRY_RUN: ${DRY_RUN:-true}
    volumes:
      - browser-automation-data:/app/data
    expose:
      - "3000"
    networks:
      - automation
    ipc: host
    restart: unless-stopped

networks:
  automation:
    external: true

volumes:
  browser-automation-data:
