services:
  n8n:
    image: ${N8N_IMAGE:?N8N_IMAGE must be set to a pinned n8n tag}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:5678:5678"
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      TZ: ${TZ:-Europe/Brussels}

      # Shared AI module
      CODEX_BRIDGE_URL: ${CODEX_BRIDGE_URL:-http://codex-bridge:3010}
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:?CODEX_BRIDGE_TOKEN is required}

      # Shared browser automation worker
      BROWSER_AUTOMATIONS_URL: ${BROWSER_AUTOMATIONS_URL:-http://browser-automations:3000}
      AUTOMATION_API_TOKEN: ${AUTOMATION_API_TOKEN:?AUTOMATION_API_TOKEN is required}

      # Temporary migration compatibility: prospection-auto
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      LINKEDIN_WORKER_URL: ${LINKEDIN_WORKER_URL:-http://linkedin-worker:3000}
      ARGOS_BASE_URL: ${ARGOS_BASE_URL:-https://argos.lelouet.fr}
      N8N_REVIEW_FORM_URL: ${N8N_REVIEW_FORM_URL:-http://localhost:5678/form/prospect-review}
      DRY_RUN: ${DRY_RUN:-true}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - automation

  codex-bridge:
    build:
      context: ../codex-bridge
      args:
        CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-ghcr.io/dokor/codex-runtime:0.156.1-r1}
    container_name: codex-bridge
    restart: unless-stopped
    environment:
      PORT: 3010
      CODEX_HOME: /home/node/.codex
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:?CODEX_BRIDGE_TOKEN is required}
      CODEX_MAX_CONCURRENCY: ${CODEX_MAX_CONCURRENCY:-1}
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-180000}
      CODEX_MAX_BODY_BYTES: ${CODEX_MAX_BODY_BYTES:-262144}
    expose:
      - "3010"
    volumes:
      - codex_home:/home/node/.codex
    networks:
      - automation
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  automation:
    external: true

volumes:
  n8n_data:
    name: ${N8N_DATA_VOLUME:-prospection-auto_n8n_data}
  codex_home:
    name: ${CODEX_HOME_VOLUME:-codex_bridge_home}
