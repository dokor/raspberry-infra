api:
  dashboard: true

log:
  level: DEBUG

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  le:
    acme:
      email: "antoine@lelouet.fr"
      storage: "/acme.json"
      httpChallenge:
        entryPoint: web
