api:
  dashboard: false
  insecure: false

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: false
  websecure:
    address: ":443"
    forwardedHeaders:
      insecure: false

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  le:
    acme:
      email: "antoine@lelouet.fr"
      storage: "/acme.json"
      httpChallenge:
        entryPoint: web
