services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/portainer:/data
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.7.19
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ${TRAEFIK_ACME_FILE:?Set an absolute persistent ACME file outside the checkout}:/acme.json
    env_file:
      - ${PROXY_ENV_FILE:?Set an absolute persistent proxy environment file}
    networks:
      - proxy
      - docker_api
      - n8n_ingress
    security_opt: [no-new-privileges:true]
    depends_on: [docker-socket-proxy]
    labels:
      traefik.enable: "false"

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:fd989c12c74edb8424f53f31a2054459f286967c93e113e91ea95432f066493b
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      AUTH: "0"
      SECRETS: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_api]
    security_opt: [no-new-privileges:true]

networks:
  docker_api:
    internal: true
  n8n_ingress:
    external: true
    name: n8n_ingress
  proxy:
    external: true
    name: proxy
